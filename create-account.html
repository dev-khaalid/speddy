<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <!-- Bootstrap Icons
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> -->
  
  <!-- Remix Icon 
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet"> -->
  
  <!-- Boxicons
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"> -->
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Oswald&family=Playfair+Display&family=Montserrat&family=Poppins&family=Inter&family=Roboto+Mono&family=JetBrains+Mono&family=Lato&family=Open+Sans&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="create-account.css" />
  
</head>

<body>
  
  <div id="body">
    <div id="titles">
      <h3 id="title">Create Account</h3>
      <p id="sub-title">Provide these details to create a Speddy account.</p>
    </div>
    
    <div id="form">
      <div id="names">
        <input type="text" class="input" id="fname" placeholder="Firstname" maxlength="15">
        <input type="text" class="input" id="lname" placeholder="Lastname" maxlength="15">
      </div>
      <input type="tel" class="input fivemg" id="phone" placeholder="Phone number" maxlength="11">
      <input type="email" class="input fivemg" id="email" placeholder="Email address" maxlength="50">
      <div class="select">
        <select id="gender">
          <option value="" selected disabled>Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="select">
        <select id="type">
          <option value="" selected disabled>You are?</option>
          <option value="landlord">Landlord</option>
          <option value="agent">Agent</option>
          <option value="student">Student tenant</option>
          <option value="tenant">Other tenant</option>
        </select>
      </div>
      
      <div id="passwords">
        <input type="tel" class="input" id="password" placeholder="6-digit Password" maxlength="6">
        <input type="tel" class="input" id="password2" placeholder="6-digit Password(again)" maxlength="6">
      </div>
      
      <div class="info">
        <p><span class="fa-solid fa-circle-info"></span><span>Please ensure your details are correct. Anytime, our team may try to reach you through emails or phone calls for verification, if we encounter a problem reaching you multiple times, your account would be deleted.</span></p>
      </div>
      
      <button class="button" type="submit" id="create"><span class="fa-solid fa-user-plus"></span><span>Create Account</span></button>
    </div>
  </div>
  
</body>

</html>
