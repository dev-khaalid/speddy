<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <!-- Bootstrap Icons
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> -->
  
  <!-- Remix Icon 
  <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet"> -->
  
  <!-- Boxicons
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"> -->
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Oswald&family=Playfair+Display&family=Montserrat&family=Poppins&family=Inter&family=Roboto+Mono&family=JetBrains+Mono&family=Lato&family=Open+Sans&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
  
</head>

<body>
  
  <div id="body">
    <div id="titles">
      <h3 id="title">Log In</h3>
      <p id="sub-title">Proceed to log in to your account using your username and password.</p>
    </div>
    
    <div id="form">
      <input type="text" class="input" id="username" placeholder="Username" maxlength="29">
    
      <input type="tel" class="input" id="password" placeholder="6-digit Password" maxlength="6">
      
      <div class="info">
        <p><span class="fa-solid fa-circle-info"></span><span>Your username is the 5-character entity assigned to you upon account creation.</span></p>
      </div>
      
      <button class="button" type="submit" id="login"><span class="fa-solid fa-user-plus"></span><span>Log In</span></button>
    </div>
  </div>
  
</body>

</html>
